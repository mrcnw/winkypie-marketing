<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>meta-ads-konfiguracja</title>
<style>
  :root { color-scheme: light dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { font: 14px/1.45 system-ui, Segoe UI, sans-serif; background: #0f1115; color: #e6e8ec;
         display: flex; flex-direction: column;
         /* bez tego przeciaganie po rysunku zaznacza tekst wewnatrz SVG */
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px;
           background: #171a21; border-bottom: 1px solid #262b36; flex: 0 0 auto }
  h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .spacer { flex: 1 1 auto }
  button { font: inherit; padding: 5px 11px; border-radius: 7px; border: 1px solid #333a49;
           background: #20242e; color: #e6e8ec; cursor: pointer }
  button:hover { background: #2a3040 }
  button.waski { padding: 5px 8px }
  small { color: #8b93a4; white-space: nowrap }
  small.brak { color: #ff8787 }
  /* pole musi samo sobie przywrocic zaznaczanie — body ma user-select:none */
  input#q { font: inherit; width: 170px; padding: 5px 9px; border-radius: 7px;
            border: 1px solid #333a49; background: #20242e; color: #e6e8ec;
            user-select: text; -webkit-user-select: text }
  input#q:focus { outline: none; border-color: #4c6ef5 }
  #stage { flex: 1 1 auto; overflow: hidden; background: #fff; position: relative;
           touch-action: none; cursor: grab }
  #stage.drag { cursor: grabbing }
  #pan { position: absolute; inset: 0; transform-origin: 0 0 }
  /* SVG nie lapie zdarzen wskaznika — dzieki temu ciagniemy plotno, a nie napis */
  #pan svg { display: block; width: 100%; height: 100%; pointer-events: none }
  /* podswietlenie trafienia — prostokat wstrzykniety POD tekst, w tej samej grupie SVG,
     wiec jezdzi razem z rysunkiem i nie wymaga przeliczania wspolrzednych */
  #pan svg rect.trafienie { fill: #ffe066; opacity: .5 }
  #pan svg rect.trafienie.aktywne { fill: #ff922b; opacity: .6 }
</style></head>
<body>
<header>
  <h1>meta-ads-konfiguracja</h1><span class="spacer"></span>
  <input id="q" type="text" placeholder="szukaj… (Ctrl+F)" autocomplete="off" spellcheck="false">
  <small id="qn">0 / 0</small>
  <button id="qp" class="waski" title="poprzednie (Shift+Enter)">&#8593;</button><button id="qx" class="waski" title="nastepne (Enter)">&#8595;</button>
  <small id="z">100%</small>
  <button id="out">−</button><button id="in">+</button><button id="fit">Dopasuj</button>
</header>

<script>
const stage = document.getElementById('stage'), pan = document.getElementById('pan'), zLab = document.getElementById('z')
let k = 1, tx = 0, ty = 0
const apply = () => { pan.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')'
                      zLab.textContent = Math.round(k * 100) + '%' }
const zoomAt = (cx, cy, f) => {
  const nk = Math.min(8, Math.max(0.1, k * f))
  tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k); k = nk; apply()
}
stage.addEventListener('wheel', (e) => { e.preventDefault(); const r = stage.getBoundingClientRect()
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12) }, { passive: false })
let drag = null
stage.addEventListener('pointerdown', (e) => {
  e.preventDefault()                        // bez tego przegladarka zaczyna zaznaczac
  drag = { x: e.clientX - tx, y: e.clientY - ty }
  stage.setPointerCapture(e.pointerId); stage.classList.add('drag')
})
stage.addEventListener('pointermove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply() })
for (const ev of ['pointerup', 'pointercancel'])
  stage.addEventListener(ev, () => { drag = null; stage.classList.remove('drag') })
stage.addEventListener('selectstart', (e) => e.preventDefault())
stage.addEventListener('dragstart', (e) => e.preventDefault())
document.getElementById('in').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.25)
document.getElementById('out').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.25)
document.getElementById('fit').onclick = () => { k = 1; tx = 0; ty = 0; apply() }
apply()
// kontrakt dla viewer-search.js: ten skrypt trzyma kadr, tamten go przesuwa
window.__widok = { stage, apply, zoomAt,
  get k() { return k }, set k(v) { k = v },
  get tx() { return tx }, set tx(v) { tx = v },
  get ty() { return ty }, set ty(v) { ty = v } }
</script>
<script>
// viewer-search.js — szukanie tekstu na wygenerowanej stronie z rysunkiem.
//
// Ten plik NIE jest modulem. stronaPodgladu() w browser.mjs wkleja go w <script>
// w srodku HTML-a, wiec:
//   • zadnych import/export,
//   • nie moze zawierac ciagu zamykajacego skrypt,
//   • z pan/zoomem rozmawia przez window.__widok (kontrakt ustawiony w browser.mjs).
//
// PO CO TO, skoro przegladarka ma Ctrl+F: Chrome i Firefox ZNAJDUJA tekst w inline SVG
// (to prawdziwe wezly <text>, nie piksele), ale Chrome go nie podswietla, a strona nie ma
// scrolla — kadrem steruje transform — wiec przegladarka nie umie dojechac do trafienia
// lezacego poza ekranem. Dlatego wlasne pole: podswietla i przesuwa kadr.
//
// ⚠️ Eksport SVG rozbija akapit na OSOBNY <text> per linia. Fraza przechodzaca przez
// zlamanie linii nie zostanie tu znaleziona — w search.mjs zostanie, bo tam czytamy
// originalText ze znakami nowej linii.
(function () {
  const V = window.__widok
  const pole = document.getElementById('q')
  const licznik = document.getElementById('qn')
  if (!V || !pole || !licznik) return

  const NS = 'http://www.w3.org/2000/svg'

  /* ── normalizacja ────────────────────────────────────────────────────────────
   * Diagramy sa po polsku, wiec „segmentacje" ma trafiac w „SEGMENTACJĘ". Zdejmujemy
   * znaki diakrytyczne i wielkosc liter, ale ZNAK PO ZNAKU i tylko wtedy, gdy dlugosc
   * sie zgadza — inaczej indeksy w tekscie przestaja pasowac do indeksow glifow i
   * podswietlenie ladu je obok slowa. „ł" nie ma rozkladu NFD, wiec ma wlasny wpis. */
  const RECZNIE = { 'ł': 'l', 'Ł': 'l' }
  function znak(ch) {
    if (/\s/.test(ch)) return ' '
    const r = RECZNIE[ch]
    if (r) return r
    const d = ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    return d.length === ch.length ? d : ch
  }
  function norm(s) {
    let out = ''
    for (const ch of s) out += znak(ch)
    return out
  }

  /* ── zrodla: kazdy <text> to JEDNA linia tekstu ──────────────────────────── */
  let zrodla = null
  function zbierz() {
    if (zrodla) return zrodla
    zrodla = []
    for (const el of document.querySelectorAll('#pan svg text')) {
      const tresc = el.textContent || ''
      if (!tresc.trim()) continue
      zrodla.push({ el, norm: norm(tresc), gora: 0, lewo: 0 })
    }
    // kolejnosc czytania (z gory na dol, potem od lewej). Mierzymy raz i wszystkie
    // naraz, wiec biezacy pan/zoom nie ma znaczenia — dotyka wszystkich tak samo.
    for (const z of zrodla) {
      const r = z.el.getBoundingClientRect()
      z.gora = Math.round(r.top); z.lewo = Math.round(r.left)
    }
    zrodla.sort((a, b) => (a.gora - b.gora) || (a.lewo - b.lewo))
    return zrodla
  }

  /* ── stan ────────────────────────────────────────────────────────────────── */
  let trafienia = []
  let aktywne = -1

  function czysc() {
    for (const t of trafienia) if (t.rect && t.rect.parentNode) t.rect.parentNode.removeChild(t.rect)
    trafienia = []; aktywne = -1
  }

  // Prostokat podswietlenia wstawiamy DO TEJ SAMEJ grupy co tekst i PRZED nim:
  // grupa ma juz transform elementu, wiec prostokat sam jezdzi z pan/zoomem, a wstawiony
  // przed tekstem laduje pod literami, nie na nich.
  function podswietl(el, od, do_) {
    let b = null
    try {
      const a = el.getExtentOfChar(od)
      const z = el.getExtentOfChar(Math.max(od, do_ - 1))
      const x1 = Math.min(a.x, z.x), x2 = Math.max(a.x + a.width, z.x + z.width)
      const y1 = Math.min(a.y, z.y), y2 = Math.max(a.y + a.height, z.y + z.height)
      if (x2 > x1 && y2 > y1) b = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
    } catch { b = null }   // getExtentOfChar potrafi rzucic — wtedy podswietlamy cala linie
    if (!b) { const g = el.getBBox(); b = { x: g.x, y: g.y, w: g.width, h: g.height } }
    const r = document.createElementNS(NS, 'rect')
    r.setAttribute('x', b.x - 1); r.setAttribute('y', b.y - 1)
    r.setAttribute('width', b.w + 2); r.setAttribute('height', b.h + 2)
    r.setAttribute('rx', 2); r.setAttribute('class', 'trafienie')
    el.parentNode.insertBefore(r, el)
    return r
  }

  function maluj() {
    for (let i = 0; i < trafienia.length; i++) {
      trafienia[i].rect.setAttribute('class', i === aktywne ? 'trafienie aktywne' : 'trafienie')
    }
    licznik.textContent = trafienia.length ? (aktywne + 1) + ' / ' + trafienia.length : '0 / 0'
    licznik.className = trafienia.length ? '' : 'brak'
  }

  function szukaj(fraza) {
    czysc()
    const q = norm(String(fraza || '')).trim()
    if (!q) { maluj(); zapiszLink(''); return }
    for (const z of zbierz()) {
      let i = 0
      while ((i = z.norm.indexOf(q, i)) !== -1) {
        trafienia.push({ el: z.el, od: i, do: i + q.length, rect: null })
        i += q.length
      }
    }
    for (const t of trafienia) t.rect = podswietl(t.el, t.od, t.do)
    if (trafienia.length) idz(0); else maluj()
    zapiszLink(fraza)
  }

  // Skok do trafienia: najpierw zoom (jesli rysunek jest oddalony, samo wysrodkowanie
  // daje nieczytelny znaczek), POTEM pomiar i korekta przesuniecia — w tej kolejnosci,
  // bo zoom zmienia polozenie prostokata na ekranie.
  function idz(i) {
    if (!trafienia.length) return
    aktywne = (i + trafienia.length) % trafienia.length
    maluj()
    if (V.k < 1.5) { V.k = 1.8; V.apply() }
    const s = V.stage.getBoundingClientRect()
    const r = trafienia[aktywne].rect.getBoundingClientRect()
    V.tx += (s.left + s.width / 2) - (r.left + r.width / 2)
    V.ty += (s.top + s.height / 2) - (r.top + r.height / 2)
    V.apply()
  }

  // Fraza w adresie, zeby dalo sie podac komus link prosto do miejsca w rysunku
  // (tak wchodzi wynik z search.mjs i z galerii). replaceState, zeby nie zasmiecac historii.
  function zapiszLink(fraza) {
    if (!history.replaceState) return
    const h = fraza ? '#q=' + encodeURIComponent(fraza) : ''
    if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h)
  }

  /* ── obsluga ─────────────────────────────────────────────────────────────── */
  let czekacz = null
  pole.addEventListener('input', () => {
    clearTimeout(czekacz)
    czekacz = setTimeout(() => szukaj(pole.value), 120)
  })
  pole.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(czekacz)
      if (!trafienia.length) szukaj(pole.value); else idz(aktywne + (e.shiftKey ? -1 : 1)) }
    if (e.key === 'Escape') { pole.value = ''; szukaj(''); pole.blur() }
  })
  const dalej = document.getElementById('qx'), wstecz = document.getElementById('qp')
  if (dalej) dalej.onclick = () => idz(aktywne + 1)
  if (wstecz) wstecz.onclick = () => idz(aktywne - 1)

  // Ctrl+F przejmujemy na wlasne pole — przegladarkowe „znajdz" na tej stronie nie
  // potrafi doscrollowac do trafienia (kadrem steruje transform, nie scroll).
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault(); pole.focus(); pole.select()
    }
    if (e.key === 'Escape' && document.activeElement !== pole && trafienia.length) {
      pole.value = ''; szukaj('')
    }
  })

  // wejscie z linku: index.html#q=fraza
  const h = decodeURIComponent((location.hash || '').replace(/^#q=/, ''))
  if (h && location.hash.indexOf('#q=') === 0) {
    pole.value = h
    // fonty musza byc gotowe, inaczej getExtentOfChar mierzy zastepczy krój
    const start = () => szukaj(h)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start()
  }
})()

</script>
</body></html>
