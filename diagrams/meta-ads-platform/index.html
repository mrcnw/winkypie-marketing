<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>meta-ads-panel</title>
<style>
  :root { color-scheme: light dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { font: 14px/1.45 system-ui, Segoe UI, sans-serif; background: #0f1115; color: #e6e8ec;
         display: flex; flex-direction: column;
         /* bez tego przeciaganie po rysunku zaznacza tekst wewnatrz SVG */
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px;
           background: #171a21; border-bottom: 1px solid #262b36; flex: 0 0 auto }
  h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .spacer { flex: 1 1 auto }
  button { font: inherit; padding: 5px 11px; border-radius: 7px; border: 1px solid #333a49;
           background: #20242e; color: #e6e8ec; cursor: pointer }
  button:hover { background: #2a3040 }
  button.waski { padding: 5px 8px }
  small { color: #8b93a4; white-space: nowrap }
  small.brak { color: #ff8787 }
  /* pole musi samo sobie przywrocic zaznaczanie — body ma user-select:none */
  input#q { font: inherit; width: 170px; padding: 5px 9px; border-radius: 7px;
            border: 1px solid #333a49; background: #20242e; color: #e6e8ec;
            user-select: text; -webkit-user-select: text }
  input#q:focus { outline: none; border-color: #4c6ef5 }
  #stage { flex: 1 1 auto; overflow: hidden; background: #fff; position: relative;
           touch-action: none; cursor: grab }
  #stage.drag { cursor: grabbing }
  #pan { position: absolute; inset: 0; transform-origin: 0 0 }
  /* SVG nie lapie zdarzen wskaznika — dzieki temu ciagniemy plotno, a nie napis */
  #pan svg { display: block; width: 100%; height: 100%; pointer-events: none }
  /* podswietlenie trafienia — prostokat wstrzykniety POD tekst, w tej samej grupie SVG,
     wiec jezdzi razem z rysunkiem i nie wymaga przeliczania wspolrzednych */
  #pan svg rect.trafienie { fill: #ffe066; opacity: .5 }
  #pan svg rect.trafienie.aktywne { fill: #ff922b; opacity: .6 }
</style></head>
<body>
<header>
  <h1>meta-ads-panel</h1><span class="spacer"></span>
  <input id="q" type="text" placeholder="szukaj… (Ctrl+F)" autocomplete="off" spellcheck="false">
  <small id="qn">0 / 0</small>
  <button id="qp" class="waski" title="poprzednie (Shift+Enter)">&#8593;</button><button id="qx" class="waski" title="nastepne (Enter)">&#8595;</button>
  <small id="z">100%</small>
  <button id="out">−</button><button id="in">+</button><button id="fit">Dopasuj</button>
</header>

e="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ZALETA: nie przepalasz na przegrywającym zestawie.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">WADA: słaby zestaw dostaje zero i nigdy się o nim niczego nie dowiesz.</text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Wyniki czytasz na poziomie KAMPANII, nie zestawu.</text></g><g transform="translate(1032 4226) rotate(0 430 27.5)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Każdy zestaw dostaje swoje. Algorytm NIE MA PRAWA przesuwać.</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ZALETA: czysty odczyt — każdy ma szansę wyjść z fazy uczenia.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">WADA: płacisz za przegrywających do samego końca testu.</text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Kwoty są stałe, niezależnie od wyników.</text></g><g transform="translate(82 4308) rotate(0 915 21)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">REGUŁA KCIUKA: testujesz na ABO (chcesz się czegoś dowiedzieć) · skalujesz na CBO (już wiesz i maksymalizujesz).</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Meta: CBO ma sens dopiero od 2 zestawów w górę [M6]. U NAS: kampania aplikacyjna ma JEDEN zestaw → pytanie bez treści.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Wraca dopiero przy lejku webowym (cel Sprzedaż), gdzie zestawów może być kilka.</text></g><g stroke-linecap="round" transform="translate(2012 4010) rotate(0 955 44.5)"><path d="M22.25 0 C607.07 1.21, 1193.87 2.87, 1887.75 0 C1905.51 1.52, 1910.69 5.38, 1910 22.25 C1906.29 31.85, 1907.59 44.64, 1910 66.75 C1908.18 81.84, 1899.51 85.8, 1887.75 89 C1439.82 102.89, 991.14 101.12, 22.25 89 C7.41 87.67, 2.41 81.44, 0 66.75 C0.86 50.75, -0.75 44.12, 0 22.25 C-2.01 9.08, 5.31 0.17, 22.25 0" stroke="none" stroke-width="0" fill="#ffe3e3"></path><path d="M22.25 0 C563.99 3.29, 1106.67 2.74, 1887.75 0 M22.25 0 C754.16 6.04, 1485.59 5.44, 1887.75 0 M1887.75 0 C1901.11 0.38, 1908.39 7.78, 1910 22.25 M1887.75 0 C1903.57 1.03, 1909.3 6.27, 1910 22.25 M1910 22.25 C1908.42 30.25, 1909.16 40.26, 1910 66.75 M1910 22.25 C1909.84 36.12, 1909.7 49.8, 1910 66.75 M1910 66.75 C1911.14 79.69, 1900.73 87.63, 1887.75 89 M1910 66.75 C1910.76 79.97, 1903.15 90.81, 1887.75 89 M1887.75 89 C1238.42 92.76, 590.47 92, 22.25 89 M1887.75 89 C1465.26 84.48, 1042.03 84.65, 22.25 89 M22.25 89 C6.42 89.85, -0.08 81.21, 0 66.75 M22.25 89 C6.21 91.29, -0.21 83.32, 0 66.75 M0 66.75 C2.26 54.29, 0.66 40.08, 0 22.25 M0 66.75 C0.04 55.99, 0.78 44.48, 0 22.25 M0 22.25 C1.97 7.64, 7.64 -0.06, 22.25 0 M0 22.25 C-2.21 7.98, 5.97 -1.32, 22.25 0" stroke="#e03131" stroke-width="2" fill="none"></path></g><g transform="translate(2030 4024) rotate(0 937 9)"><text x="0" y="12.334" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="14px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B · „50 zdarzeń" — NA TYDZIEŃ, nie dziennie. I liczone NA ZESTAW REKLAM.</text></g><g transform="translate(2030 4052.3) rotate(0 937 14)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Meta, dosłownie: „an ad set becomes learning limited when it is unlikely to receive about 50 optimization events IN THE WEEK after your last significant edit." [M9]</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Tydzień — nie dzień. Zestaw — nie kampania i nie pojedyncza reklama. Licznik startuje od ostatniej istotnej edycji, a każda taka edycja zeruje go od nowa.</text></g><g transform="translate(2012 4126) rotate(0 955 8.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SKĄD SIĘ BIERZE WZÓR — trzy kroki, nic więcej</text></g><g transform="translate(2012 4156) rotate(0 20 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1.</text></g><g transform="translate(2057 4156) rotate(0 310 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Potrzebujesz 50 zdarzeń w 7 dni</text></g><g transform="translate(2712 4156) rotate(0 250 8.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">50 ÷ 7 = ~7,2 zdarzenia DZIENNIE</text></g><g transform="translate(2012 4188) rotate(0 20 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2.</text></g><g transform="translate(2057 4188) rotate(0 310 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Jedno zdarzenie kosztuje tyle, ile kosztuje</text></g><g transform="translate(2712 4188) rotate(0 250 8.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">np. instalacja w USA: $4</text></g><g transform="translate(2012 4220) rotate(0 20 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3.</text></g><g transform="translate(2057 4220) rotate(0 310 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Żeby kupić 7,2 zdarzenia dziennie, musisz wydać</text></g><g transform="translate(2712 4220) rotate(0 250 8.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">7,2 × $4 = ~$29 / dzień</text></g><g transform="translate(2012 4260) rotate(0 955 15)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">„× 50 ÷ 7" to nie jest żadna magiczna stała. To skrót od „pięćdziesiąt sztuk rozłożone na siedem dni".</text><text x="0" y="25.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Efekt jest jeden: TYLE PIENIĘDZY MUSISZ WPUSZCZAĆ W REKLAMĘ KAŻDEGO DNIA, żeby algorytm zdążył się nauczyć w tydzień.</text></g><g transform="translate(2012 4292) rotate(0 955 22.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">To NIE jest limit wydatku ani cel do osiągnięcia. To MINIMUM: poniżej tej kwoty algorytm się nie nauczy, więc pieniądze idą w szum —</text><text x="0" y="25.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">a powyżej uczy się normalnie. Dlatego przy $50/dzień instalacja przechodzi, a zakup nie ma szans: $50 × 50 ÷ 7 = $357/dzień.</text><text x="0" y="40.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">I dlatego wybór zdarzenia optymalizacji (strefa 7) jest ważniejszy niż wybór licytacji, odbiorców i formatu razem wziętych.</text></g><g stroke-linecap="round" transform="translate(32 4442) rotate(0 1960 540)"><path d="M32 0 C1487.52 -8.28, 2945.29 -7.85, 3888 0 C3907.54 3.48, 3917.01 13.04, 3920 32 C " y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">o czym konkretnie mówi reklama: przed/po, demo, świadectwo, porównanie</text></g><g transform="translate(62 397) rotate(0 65 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">lookalike</text></g><g transform="translate(198 397) rotate(0 412.5 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">grupa podobnych — Meta szuka ludzi podobnych do Twojej listy klientów</text></g><g transform="translate(1037 397) rotate(0 65 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">umiejscowienie</text></g><g transform="translate(1173 397) rotate(0 412.5 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">gdzie reklama się wyświetla: feed, Reels, Stories, Marketplace</text></g><g transform="translate(2012 397) rotate(0 65 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">bid cap</text></g><g transform="translate(2148 397) rotate(0 412.5 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">sufit na pojedynczą stawkę w aukcji — „nigdy nie licytuj powyżej X"</text></g><g transform="translate(2987 397) rotate(0 65 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">hard duplicate</text></g><g transform="translate(3123 397) rotate(0 412.5 7)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">twarda kopia reklamy — zachowuje polubienia i komentarze, czyli dowód społeczny</text></g></svg></div></div>
<script>
const stage = document.getElementById('stage'), pan = document.getElementById('pan'), zLab = document.getElementById('z')
let k = 1, tx = 0, ty = 0
const apply = () => { pan.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')'
                      zLab.textContent = Math.round(k * 100) + '%' }
const zoomAt = (cx, cy, f) => {
  const nk = Math.min(8, Math.max(0.1, k * f))
  tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k); k = nk; apply()
}
stage.addEventListener('wheel', (e) => { e.preventDefault(); const r = stage.getBoundingClientRect()
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12) }, { passive: false })
let drag = null
stage.addEventListener('pointerdown', (e) => {
  e.preventDefault()                        // bez tego przegladarka zaczyna zaznaczac
  drag = { x: e.clientX - tx, y: e.clientY - ty }
  stage.setPointerCapture(e.pointerId); stage.classList.add('drag')
})
stage.addEventListener('pointermove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply() })
for (const ev of ['pointerup', 'pointercancel'])
  stage.addEventListener(ev, () => { drag = null; stage.classList.remove('drag') })
stage.addEventListener('selectstart', (e) => e.preventDefault())
stage.addEventListener('dragstart', (e) => e.preventDefault())
document.getElementById('in').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.25)
document.getElementById('out').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.25)
document.getElementById('fit').onclick = () => { k = 1; tx = 0; ty = 0; apply() }
apply()
// kontrakt dla viewer-search.js: ten skrypt trzyma kadr, tamten go przesuwa
window.__widok = { stage, apply, zoomAt,
  get k() { return k }, set k(v) { k = v },
  get tx() { return tx }, set tx(v) { tx = v },
  get ty() { return ty }, set ty(v) { ty = v } }
</script>
<script>
// viewer-search.js — szukanie tekstu na wygenerowanej stronie z rysunkiem.
//
// Ten plik NIE jest modulem. stronaPodgladu() w browser.mjs wkleja go w <script>
// w srodku HTML-a, wiec:
//   • zadnych import/export,
//   • nie moze zawierac ciagu zamykajacego skrypt,
//   • z pan/zoomem rozmawia przez window.__widok (kontrakt ustawiony w browser.mjs).
//
// PO CO TO, skoro przegladarka ma Ctrl+F: Chrome i Firefox ZNAJDUJA tekst w inline SVG
// (to prawdziwe wezly <text>, nie piksele), ale Chrome go nie podswietla, a strona nie ma
// scrolla — kadrem steruje transform — wiec przegladarka nie umie dojechac do trafienia
// lezacego poza ekranem. Dlatego wlasne pole: podswietla i przesuwa kadr.
//
// ⚠️ Eksport SVG rozbija akapit na OSOBNY <text> per linia. Fraza przechodzaca przez
// zlamanie linii nie zostanie tu znaleziona — w search.mjs zostanie, bo tam czytamy
// originalText ze znakami nowej linii.
(function () {
  const V = window.__widok
  const pole = document.getElementById('q')
  const licznik = document.getElementById('qn')
  if (!V || !pole || !licznik) return

  const NS = 'http://www.w3.org/2000/svg'

  /* ── normalizacja ────────────────────────────────────────────────────────────
   * Diagramy sa po polsku, wiec „segmentacje" ma trafiac w „SEGMENTACJĘ". Zdejmujemy
   * znaki diakrytyczne i wielkosc liter, ale ZNAK PO ZNAKU i tylko wtedy, gdy dlugosc
   * sie zgadza — inaczej indeksy w tekscie przestaja pasowac do indeksow glifow i
   * podswietlenie ladu je obok slowa. „ł" nie ma rozkladu NFD, wiec ma wlasny wpis. */
  const RECZNIE = { 'ł': 'l', 'Ł': 'l' }
  function znak(ch) {
    if (/\s/.test(ch)) return ' '
    const r = RECZNIE[ch]
    if (r) return r
    const d = ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    return d.length === ch.length ? d : ch
  }
  function norm(s) {
    let out = ''
    for (const ch of s) out += znak(ch)
    return out
  }

  /* ── zrodla: kazdy <text> to JEDNA linia tekstu ──────────────────────────── */
  let zrodla = null
  function zbierz() {
    if (zrodla) return zrodla
    zrodla = []
    for (const el of document.querySelectorAll('#pan svg text')) {
      const tresc = el.textContent || ''
      if (!tresc.trim()) continue
      zrodla.push({ el, norm: norm(tresc), gora: 0, lewo: 0 })
    }
    // kolejnosc czytania (z gory na dol, potem od lewej). Mierzymy raz i wszystkie
    // naraz, wiec biezacy pan/zoom nie ma znaczenia — dotyka wszystkich tak samo.
    for (const z of zrodla) {
      const r = z.el.getBoundingClientRect()
      z.gora = Math.round(r.top); z.lewo = Math.round(r.left)
    }
    zrodla.sort((a, b) => (a.gora - b.gora) || (a.lewo - b.lewo))
    return zrodla
  }

  /* ── stan ────────────────────────────────────────────────────────────────── */
  let trafienia = []
  let aktywne = -1

  function czysc() {
    for (const t of trafienia) if (t.rect && t.rect.parentNode) t.rect.parentNode.removeChild(t.rect)
    trafienia = []; aktywne = -1
  }

  // Prostokat podswietlenia wstawiamy DO TEJ SAMEJ grupy co tekst i PRZED nim:
  // grupa ma juz transform elementu, wiec prostokat sam jezdzi z pan/zoomem, a wstawiony
  // przed tekstem laduje pod literami, nie na nich.
  function podswietl(el, od, do_) {
    let b = null
    try {
      const a = el.getExtentOfChar(od)
      const z = el.getExtentOfChar(Math.max(od, do_ - 1))
      const x1 = Math.min(a.x, z.x), x2 = Math.max(a.x + a.width, z.x + z.width)
      const y1 = Math.min(a.y, z.y), y2 = Math.max(a.y + a.height, z.y + z.height)
      if (x2 > x1 && y2 > y1) b = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
    } catch { b = null }   // getExtentOfChar potrafi rzucic — wtedy podswietlamy cala linie
    if (!b) { const g = el.getBBox(); b = { x: g.x, y: g.y, w: g.width, h: g.height } }
    const r = document.createElementNS(NS, 'rect')
    r.setAttribute('x', b.x - 1); r.setAttribute('y', b.y - 1)
    r.setAttribute('width', b.w + 2); r.setAttribute('height', b.h + 2)
    r.setAttribute('rx', 2); r.setAttribute('class', 'trafienie')
    el.parentNode.insertBefore(r, el)
    return r
  }

  function maluj() {
    for (let i = 0; i < trafienia.length; i++) {
      trafienia[i].rect.setAttribute('class', i === aktywne ? 'trafienie aktywne' : 'trafienie')
    }
    licznik.textContent = trafienia.length ? (aktywne + 1) + ' / ' + trafienia.length : '0 / 0'
    licznik.className = trafienia.length ? '' : 'brak'
  }

  function szukaj(fraza) {
    czysc()
    const q = norm(String(fraza || '')).trim()
    if (!q) { maluj(); zapiszLink(''); return }
    for (const z of zbierz()) {
      let i = 0
      while ((i = z.norm.indexOf(q, i)) !== -1) {
        trafienia.push({ el: z.el, od: i, do: i + q.length, rect: null })
        i += q.length
      }
    }
    for (const t of trafienia) t.rect = podswietl(t.el, t.od, t.do)
    if (trafienia.length) idz(0); else maluj()
    zapiszLink(fraza)
  }

  // Ile pikselow na ekranie ma miec trafienie, zeby dalo sie je przeczytac.
  const CEL_PX = 22

  // Skok do trafienia: najpierw zoom, POTEM pomiar i korekta przesuniecia — w tej
  // kolejnosci, bo zoom zmienia polozenie prostokata na ekranie.
  //
  // ⚠️ Zoom liczymy Z WYSOKOSCI TRAFIENIA, nie ze sztywnej liczby. Sztywne „ustaw 180%"
  // dziala tylko dla malego rysunku: plotno jest wpasowane w okno (width/height 100% +
  // viewBox), wiec przy rysunku szerokim na 8000 jednostek 180% to wciaz literki po 3 px
  // — trafienie bylo idealnie na srodku ekranu i zupelnie nieczytelne.
  function idz(i) {
    if (!trafienia.length) return
    aktywne = (i + trafienia.length) % trafienia.length
    maluj()
    const rect = trafienia[aktywne].rect
    const r0 = rect.getBoundingClientRect()
    if (r0.height > 0 && r0.height < CEL_PX) {
      V.k = Math.min(8, V.k * (CEL_PX / r0.height))   // sufit taki sam jak przy zoomie kolkiem
      V.apply()
    }
    const s = V.stage.getBoundingClientRect()
    const r = rect.getBoundingClientRect()
    V.tx += (s.left + s.width / 2) - (r.left + r.width / 2)
    V.ty += (s.top + s.height / 2) - (r.top + r.height / 2)
    V.apply()
  }

  // Fraza w adresie, zeby dalo sie podac komus link prosto do miejsca w rysunku
  // (tak wchodzi wynik z search.mjs i z galerii). replaceState, zeby nie zasmiecac historii.
  function zapiszLink(fraza) {
    if (!history.replaceState) return
    const h = fraza ? '#q=' + encodeURIComponent(fraza) : ''
    if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h)
  }

  /* ── obsluga ─────────────────────────────────────────────────────────────── */
  let czekacz = null
  pole.addEventListener('input', () => {
    clearTimeout(czekacz)
    czekacz = setTimeout(() => szukaj(pole.value), 120)
  })
  pole.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(czekacz)
      if (!trafienia.length) szukaj(pole.value); else idz(aktywne + (e.shiftKey ? -1 : 1)) }
    if (e.key === 'Escape') { pole.value = ''; szukaj(''); pole.blur() }
  })
  const dalej = document.getElementById('qx'), wstecz = document.getElementById('qp')
  if (dalej) dalej.onclick = () => idz(aktywne + 1)
  if (wstecz) wstecz.onclick = () => idz(aktywne - 1)

  // Ctrl+F przejmujemy na wlasne pole — przegladarkowe „znajdz" na tej stronie nie
  // potrafi doscrollowac do trafienia (kadrem steruje transform, nie scroll).
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault(); pole.focus(); pole.select()
    }
    if (e.key === 'Escape' && document.activeElement !== pole && trafienia.length) {
      pole.value = ''; szukaj('')
    }
  })

  // wejscie z linku: index.html#q=fraza
  const h = decodeURIComponent((location.hash || '').replace(/^#q=/, ''))
  if (h && location.hash.indexOf('#q=') === 0) {
    pole.value = h
    // fonty musza byc gotowe, inaczej getExtentOfChar mierzy zastepczy krój
    const start = () => szukaj(h)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start()
  }
})()

</script>
