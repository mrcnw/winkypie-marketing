<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>meta-ads-calosc</title>
<style>
  :root { color-scheme: light dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { font: 14px/1.45 system-ui, Segoe UI, sans-serif; background: #0f1115; color: #e6e8ec;
         display: flex; flex-direction: column;
         /* bez tego przeciaganie po rysunku zaznacza tekst wewnatrz SVG */
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px;
           background: #171a21; border-bottom: 1px solid #262b36; flex: 0 0 auto }
  h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .spacer { flex: 1 1 auto }
  button { font: inherit; padding: 5px 11px; border-radius: 7px; border: 1px solid #333a49;
           background: #20242e; color: #e6e8ec; cursor: pointer }
  button:hover { background: #2a3040 }
  button.waski { padding: 5px 8px }
  small { color: #8b93a4; white-space: nowrap }
  small.brak { color: #ff8787 }
  /* pole musi samo sobie przywrocic zaznaczanie — body ma user-select:none */
  input#q { font: inherit; width: 170px; padding: 5px 9px; border-radius: 7px;
            border: 1px solid #333a49; background: #20242e; color: #e6e8ec;
            user-select: text; -webkit-user-select: text }
  input#q:focus { outline: none; border-color: #4c6ef5 }
  #stage { flex: 1 1 auto; overflow: hidden; background: #fff; position: relative;
           touch-action: none; cursor: grab }
  #stage.drag { cursor: grabbing }
  #pan { position: absolute; inset: 0; transform-origin: 0 0 }
  /* SVG nie lapie zdarzen wskaznika — dzieki temu ciagniemy plotno, a nie napis */
  #pan svg { display: block; width: 100%; height: 100%; pointer-events: none }
  /* podswietlenie trafienia — prostokat wstrzykniety POD tekst, w tej samej grupie SVG,
     wiec jezdzi razem z rysunkiem i nie wymaga przeliczania wspolrzednych */
  #pan svg rect.trafienie { fill: #ffe066; opacity: .5 }
  #pan svg rect.trafienie.aktywne { fill: #ff922b; opacity: .6 }
</style></head>

-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">koszt wygląda tak, a nie inaczej.</text></g><g transform="translate(2412 2362) rotate(0 550 8.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reguła, którą masz już spełnioną — zostaw ją tu na przyszłość:</text></g><g transform="translate(2412 2388) rotate(0 550 24.5)"><text x="0" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Bez SDK atrybucji i zdarzeń Meta nie dostaje sygnału instalacji. Kampania się</text><text x="0" y="27.703" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">NIE zatrzymuje — po cichu zaczyna kupować kliknięcia. [T1]</text><text x="0" y="43.953" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">U Ciebie to zrobione i przetestowane, więc ta bramka jest zdjęta.</text></g><g stroke-linecap="round" transform="translate(32 2572) rotate(0 1760 390)"><path d="M32 0 C1170.33 -7.71, 2310.47 -8.13, 3488 0 C3512.73 -1.03, 3522.61 12.05, 3520 32 C3523.1 248.51, 3523.55 466.62, 3520 748 C3519.24 767.87, 3510.66 781.65, 3488 780 C2397.02 799.77, 1308.34 799.87, 32 780 C12.62 782.4, 0.04 772.33, 0 748 C3.45 600.09, 4.54 451.67, 0 32 C2.26 11.89, 12.63 2.94, 32 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M32 0 C1011.35 -9.69, 1992.1 -8.9, 3488 0 M3488 0 C3507.47 -0.18, 3518.06 11.79, 3520 32 M3520 32 C3519.71 261.02, 3519.26 489.25, 3520 748 M3520 748 C3521.11 770.04, 3511.21 781.88, 3488 rm="translate(52 2668) rotate(0 420 76)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Baza = mediana CPM z Twoich ostatnich 30 dni, na Twoim koncie.</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Nie benchmark z internetu.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Przykład: zwykle masz $12, nagle zestaw pokazuje $26 — to sygnał.</text><text x="0" y="64.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Dlaczego względnie, a nie na sztywno: CPM zależy od geo, sezonu,</text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">miejsca wyświetlania i branży. „$45 to dużo" nic nie znaczy, dopóki</text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">nie wiesz, CZYJE to $45.</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Motion — największy publiczny zbiór danych o kreacjach — celowo</text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">NIE podaje progów bezwzględnych. To nie ostrożność, to metodologia.</text></g><g stroke-linecap="round" transform="translate(932 2608) rotate(0 420 22)"><path d="M11 0 C242.04 -5.64, 474.22 -5.72, 829 0 C832.81 -0.93, 838.32 6.93, 840 11 C841.41 15.81, 841.14 26.75, 840 33 C841.77 41.13, 833.79 46.52, 829 44 C650.05 37.62, 473.09 39.45, 11 44 C5.5 45.84, 3.08 42.01, 0 33 C2.05 30.68, 1.08 21.2, 0 11 C2.98 6.64, 6.99 -0.15, 11 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M11 0 C250.38 -1.25, 488.71 -1.09, 829 0 M11 0 C182.3 -3.09, 354.28 -2.98, 829 0 M829 0 C838.04 -1.78, 841.47 2.69, 840 11 M829 0 C834.94 0.1, 838.01 5.65, 840 11 M840 11 C841.25 16.95, 838.42 24.34, 840 33 M840 11 C840.74 17.42, 840.15 23.76, 840 33 M840 33 C840.96 39.58, 836.4 42.53, 829 44 M840 33 C839.64 39.2, 834.76 42.11, 829 44 M829 44 C514.99 45.18, 202.91 45.05, 11 44 M829 44 C522.83 46.03, 215.79 45.93, 11 44 M11 44 C4.29 45.66, 1.64 41.91, 0 33 M11 44 C5.26 45.79, 1.68 38.05, 0 33 M0 33 C0.95 26.23, -0.12 22.9, 0 11 M0 33 C-0.54 24.32, 0.41 18.12, 0 11 M0 11 C1.86 3.11, 4.95 -0.73, 11 0 M0 11 C-0.31 2.66, 1.67 -0.54, 11 0" stroke="#e8590c" stroke-width="2" fill="none"></path></g><g transform="translate(1229.5 2621) rotate(0 122.5 9)"><text x="122.5" y="12.334" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">„lowest cost" i jak działa aukcja</text></g><g transform="translate(932 2668) rotate(0 420 82.5)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">To NIE jest przycisk „zrób taniej". To instrukcja dla aukcji: wydaj cały</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">budżet i przynieś tyle wyników, ile się da — po cenie, jaka wyjdzie.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Warianty stawkowania:</text><text x="0" y="64.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">— lowest cost — bez ograniczeń, maksymalny wolumen</text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">— cost per result goal — trzymaj średnio $X za wynik</text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">— bid cap — nigdy nie licytuj powyżej $X w jednej aukcji</text><text x=" lbo zainstalowali.</text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Rozróżnienie ma znaczenie, bo progi frequency i oczekiwany koszt</text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">są dla obu grup zupełnie inne.</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Na starcie robisz wyłącznie prospecting — nie masz jeszcze z czego</text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">zbudować grupy retargetingowej.</text></g><g stroke-linecap="round" transform="translate(52 2942) rotate(0 420 22)"><path d="M11 0 C332.32 -1.66, 652.23 -1.99, 829 0 C837.17 -3.47, 841.11 0.29, 840 11 C842.94 21.72, 839.74 24.67, 840 33 C840.95 39.43, 838.56 43.64, 829 44 C501.92 43.69, 173.51 43.62, 11 44 C3.17 40.82, 1.38 41.53, 0 33 C0.52 25.05, -3.74 20.92, 0 11 C1.62 2.67, 0.95 -2.9, 11 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M11 0 C261.4 1.22, 510.16 1.08, 829 0 M11 0 C327.55 2.28, 643.92 2.05, 829 0 M829 0 C836.62 -0.38, 839.68 5.1, 840 11 M829 0 C83  font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">się. Jedyny twardy próg, jaki podaje Motion: powyżej 90%.</text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">hook rate = 3-sekundowe odtworzenia ÷ wyświetlenia. Z tych, u których</text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ruszyło — ilu zostało trzy sekundy.</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">„1. klatka OK, hook niski" = plik jest dobry, ale otwarcie nie zatrzymuje</text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">kciuka. To problem TREŚCI pierwszych 3 sekund, nie pliku.</text><text x="0" y="160.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="174.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">W feedzie wideo startuje samo — pierwsze klatki SĄ miniaturką.</text></g><g stroke-linecap="round" transform="translate(932 2942) rotate(0 420 22)"><path d="M11 0 C313.59 -2.58, 613.41 -0.8, 829 0 C833.72 -1.39, 840.39 3.71, 840 11 C839.57 18.03, 842.37 26.57, 840 33 C843.16 37.23, 836.29 42.89, 829 44 C619.64 40.52, 408.63 41.59, 11 44 C0.7 42.88, 2.4 43.61, 0 33 C1.54 28.39, 2.68 20.05, 0 11 C-0.06 0.14, 0.07 -1.97, 11 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M11 0 C227.3 -1.89, 444.02 -1.56, 829 0 M11 0 C284.49 2.44, 557.61 2.5, 829 0 M829 0 C837.54 1.12, 841.21 3.96, 840 11 M829 0 C835.77 1.46, 840.28 5.7, 840 11 M840 11 C840.74 17.07, 839.36 18.45, 840 33 M840 11 C840.25 18.4, 840.53 27.34, 840 33 M840 33 C841.16 42.19, 836.77 42.93, 829 44 M840 33 C838.71 41.5, 837 45.62, 829 44 M829 44 C515.4 44.6, 200.7 44.33, 11 44 M829 44 C564.62 47.47, 301.18 46.87, 11 44 M11 44 C3.36 45.84, -1.52 38.99, 0 33 M11 44 C5.81 42.81, -0.35 38.99, 0 33 M0 33 C-0.22 23.66, -0.81 16.3, 0 11 M0 33 C0.62 27.35, 0.4 23.61, 0 11 M0 11 C1.64 3.06, 3.76 -0.88, 11 0 M0 11 C-1.04 5.01, 1.44 1.8, 11 0" stroke="#e8590c" stroke-width="2" fill="none"></path></g><g transform="translate(1283 2955.5) rotate(0 69 8.5)"><text x="69" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Jaki budżet na start</text></g><g transform="translate(932 3002) rotate(0 420 89.5)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">$100/dzień przez 2 tygodnie. Jedna kampania, jeden zestaw,</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">optymalizacja pod instalację.</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Dlaczego nie $50: przy CPI ~$5,28 w USA sam próg 50 zdarzeń</text><text x="0" y="64.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">wymaga $38/dzień. $50 to zero zapasu — jeden gorszy tydzień</text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">i stoisz w „Learning Limited".</text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Dlaczego nie $150: przy $100 masz już ~2,5× zapasu nad progiem.</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">$150 nie kupuje proporcjonalnie więcej NAUKI, tylko więcej wydatku</text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">na kreacje, których jeszcze nie sprawdziłeś.</text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="160.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">$700/tydz. × 2 = $1400 — mieści się w ~$1500, które repo już</text><text x="0" y="174.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">zaplanowało jako koszt wejścia w ten kanał.</text></g><g stroke-linecap="round" transform="translate(1812 2942) rotate(0 420 22)"><path d="M11 0 C273.34 3.49, 534.73 3.07, 829 0 C838.24 -3.02, 842.77 6.09, 840 11 C843.07 15.36, 842.96 23.07, 840 33 C842.64 37.23, 834.19 40.62, 829 44 C659.11 42.97, 485.12 44.5, 11 44 C1.41 43.03, -1.88 41.58, 0 33 C1.34 27.53, -1.94 13.95, 0 11 C0.69 4.19, 5.51 2.5, 11 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M11 0 C189.89 1.98, 368.59 1.08, 829 0 M11 0 C298.35 -0.87, 585.71 -0.89, 829 0 M829 0 C837.97 1.2, 840.28 4.28, 840 11 M829 0 C837.15 -0.72, 841.69 3.64, 840 11 M840 11 C841.2 18.02, 839.5 21.38, 840 33 M840 11 C840.81 17.24, 840.29 24.7, 840 33 M840 33 C840 40.2, 837.27 44.07, 829 44 M840 33 C839.94 41.46, 837.29 45.69, 829 44 M829 44 C576.73 41.84, 325.89 41.47, 11 44 M829 44 C524.25 43.19, 219.92 43.35, 11 44 M11 44 C4.83 42.94, -0.47 41.23, 0 33 M11 44 C3.19 44.91, -0.61 42.43, 0 33 M0 33 C0.65 27.31, 1.71 20.55, 0 11 M0 33 C0.88 27.61, 0.54 20.47, 0 11 M0 11 C-1.37 3.58, 2.41 1.79, 11 0 M0 11 C1.37 3.7, 5.41 0.11, 11 0" stroke="#e8590c" stroke-width="2" fill="none"></path></g><g transform="translate(2032 2955.5) rotate(0 200 8.5)"><text x="200" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Sprzeczność: „nie zmieniaj kreacji" vs „odświeżaj kreacje"</text></g><g transform="translate(1812 3002) rotate(0 420 110)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Masz rację, że to wygląda na sprzeczność. Rozwiązanie ma cztery piętra.</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1. W PIERWSZEJ fazie uczenia nie dokładasz nic. Dlatego 10–15 kreacji</text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ma być gotowych PRZED startem.</text><text x="0" y="64.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2. Wyłączenie słabej reklamy to nie to samo co dodanie nowej. Meta na</text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">liście istotnych zmian wymienia „dodanie nowej reklamy" — pauzy</text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">pojedynczej reklamy tam NIE MA. Zabijanie martwych kreacji jest tanie,</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">dokładanie drogie.</text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3. Reset po wyjściu z nauki kosztuje mniej, niż brzmi. Zestaw z historią</text><text x="0" y="160.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">uczy się szybciej niż zimny — tracisz kilka dni mniej stabilnej dostawy,</text><text x="0" y="174.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">nie wszystko.</text><text x="0" y="188.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="202.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4. Twój pomysł z nowym zestawem jest jedną z dwóch realnych dróg —</text><text x="0" y="215.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ale nie przy tym budżecie. Patrz obok.</text></g><g stroke-linecap="round" transform="translate(2692 2942) rotate(0 420 22)"><path d="M11 0 C309.11 -2.9, 608.57 -3.28, 829 0 C835.62 1.82, 838 1.84, 840 11 C841.13 21.7, 837.93 26.18, 840 33 C841.77 43.43, 838.16 42.17, 829 44 C629.55 46.88, 428.06 46.01, 11 44 C1.49 42.22, -1.65 43.01, 0 33 C1.54 23.9, -0.71 16.69, 0 11 C-3.21 2.44, 3.92 0.44, 11 0" stroke="none" stroke-width="0" fill="#ffe8cc"></path><path d="M11 0 C252.88 1.12, 495.03 0.98, 829 0 M11 0 C300.37 2.48, 590.42 3.05, 829 0 M829 0 C835.97 -0.82, 838.06 2.01, 840 11 M829 0 C837.55 -1.96, 838.29 5.19, 840 11 M840 11 C838.23 13.92, 839.49 21.37, 840 33 M840 11 C840.05 16.72, 840.43 22.27, 840 33 M840 33 C841.96 39.68, 837.77 43.5, 829 44 M840 33 C839 40.5, 834.34 45.02, 829 44 M829 44 C541.17 41.11, 252.31 41, 11 44 M829 44 C588.61 41.31, 348.07 40.75, 11 44 M11 44 C2.83 45.79, -0.64 39.59, 0 33 M11 44 C5.33 45.27, 1.22 38.26, 0 33 M0 33 C-1.94 27.28, 1.6 18.97, 0 11 M0 33 C0.48 28.52, 0.75 22.88, 0 11 M0 11 C0.52 3.85, 5.52 1.94, 11 0 M0 11 C-1.75 3.06, 3.08 -1.34, 11 0" stroke="#e8590c" stroke-width="2" fill="none"></path></g><g transform="translate(2950 2955.5) rotate(0 162 8.5)"><text x="162" y="11.453" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Dwie drogi odświeżania — i dlaczego wybierasz A</text></g><g transform="translate(2692 3002) rotate(0 420 110)"><text x="0" y="9.690999999999999" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A · KONSOLIDACJA (dla Ciebie)</text><text x="0" y="23.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Jeden zestaw, odświeżanie PARTIAMI co ~2 tygodnie. Dokładasz</text><text x="0" y="37.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">5 kreacji naraz = JEDEN reset zamiast pięciu. Reset planujesz</text><text x="0" y="50.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">w kalendarzu, zamiast wpadać na niego przypadkiem.</text><text x="0" y="64.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="78.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B · OSOBNY ZESTAW TESTOWY</text><text x="0" y="92.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Nowe koncepty walczą obok, zwycięzcy wędrują do głównego zestawu.</text><text x="0" y="105.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Kosztuje drugi budżet i grozi licytowaniem przeciwko samemu sobie —</text><text x="0" y="119.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Meta wprost ostrzega przed nakładaniem się kampanii na tę samą</text><text x="0" y="133.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">publiczność. [T1]</text><text x="0" y="147.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="160.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Przy $100/dzień droga B dzieli Twoje 50 zdarzeń na dwa zestawy</text><text x="0" y="174.691" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">i ŻADEN się nie nauczy.</text><text x="0" y="188.441" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="202.191" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">→ Reguła brzmi więc nie „nie dodawaj kreacji", tylko:</text><text x="0" y="215.941" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="11px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">nie dodawaj PO JEDNEJ i nie w trakcie aktywnej nauki.</text></g><g transform="translate(52 3306) rotate(0 1740 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#e8590c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Wszystko w tej strefie dotyczy zestawu reklam, nie kampanii — faza uczenia liczy się NA ZESTAW. To jedno zdanie tłumaczy w y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">sufit na pojedynczą stawkę w aukcji</text></g><g transform="translate(62 316) rotate(0 75 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">lookalike</text></g><g transform="translate(218 316) rotate(0 495 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">grupa podobnych — Meta szuka ludzi podobnych do Twojej listy</text></g><g transform="translate(1232 316) rotate(0 75 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">faza uczenia</text></g><g transform="translate(1388 316) rotate(0 495 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">okres, w którym algorytm zbiera ~50 zdarzeń TYGODNIOWO na zestaw reklam</text></g><g transform="translate(2402 316) rotate(0 75 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Learning Limited</text></g><g transform="translate(2558 316) rotate(0 495 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">stan trwały: zestaw nie zbierze tych 50 zdarzeń. Sam nie minie</text></g><g transform="translate(62 340) rotate(0 75 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">atrybucja</text></g><g transform="translate(218 340) rotate(0 495 7.5)"><text x="0" y="10.572" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">przypisanie sprzedaży do reklamy, która ją wywołała</text></g></svg></div></div>
<script>
const stage = document.getElementById('stage'), pan = document.getElementById('pan'), zLab = document.getElementById('z')
let k = 1, tx = 0, ty = 0
const apply = () => { pan.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')'
                      zLab.textContent = Math.round(k * 100) + '%' }
const zoomAt = (cx, cy, f) => {
  const nk = Math.min(8, Math.max(0.1, k * f))
  tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k); k = nk; apply()
}
stage.addEventListener('wheel', (e) => { e.preventDefault(); const r = stage.getBoundingClientRect()
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12) }, { passive: false })
let drag = null
stage.addEventListener('pointerdown', (e) => {
  e.preventDefault()                        // bez tego przegladarka zaczyna zaznaczac
  drag = { x: e.clientX - tx, y: e.clientY - ty }
  stage.setPointerCapture(e.pointerId); stage.classList.add('drag')
})
stage.addEventListener('pointermove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply() })
for (const ev of ['pointerup', 'pointercancel'])
  stage.addEventListener(ev, () => { drag = null; stage.classList.remove('drag') })
stage.addEventListener('selectstart', (e) => e.preventDefault())
stage.addEventListener('dragstart', (e) => e.preventDefault())
document.getElementById('in').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.25)
document.getElementById('out').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.25)
document.getElementById('fit').onclick = () => { k = 1; tx = 0; ty = 0; apply() }
apply()
// kontrakt dla viewer-search.js: ten skrypt trzyma kadr, tamten go przesuwa
window.__widok = { stage, apply, zoomAt,
  get k() { return k }, set k(v) { k = v },
  get tx() { return tx }, set tx(v) { tx = v },
  get ty() { return ty }, set ty(v) { ty = v } }
</script>
<script>
// viewer-search.js — szukanie tekstu na wygenerowanej stronie z rysunkiem.
//
// Ten plik NIE jest modulem. stronaPodgladu() w browser.mjs wkleja go w <script>
// w srodku HTML-a, wiec:
//   • zadnych import/export,
//   • nie moze zawierac ciagu zamykajacego skrypt,
//   • z pan/zoomem rozmawia przez window.__widok (kontrakt ustawiony w browser.mjs).
//
// PO CO TO, skoro przegladarka ma Ctrl+F: Chrome i Firefox ZNAJDUJA tekst w inline SVG
// (to prawdziwe wezly <text>, nie piksele), ale Chrome go nie podswietla, a strona nie ma
// scrolla — kadrem steruje transform — wiec przegladarka nie umie dojechac do trafienia
// lezacego poza ekranem. Dlatego wlasne pole: podswietla i przesuwa kadr.
//
// ⚠️ Eksport SVG rozbija akapit na OSOBNY <text> per linia. Fraza przechodzaca przez
// zlamanie linii nie zostanie tu znaleziona — w search.mjs zostanie, bo tam czytamy
// originalText ze znakami nowej linii.
(function () {
  const V = window.__widok
  const pole = document.getElementById('q')
  const licznik = document.getElementById('qn')
  if (!V || !pole || !licznik) return

  const NS = 'http://www.w3.org/2000/svg'

  /* ── normalizacja ────────────────────────────────────────────────────────────
   * Diagramy sa po polsku, wiec „segmentacje" ma trafiac w „SEGMENTACJĘ". Zdejmujemy
   * znaki diakrytyczne i wielkosc liter, ale ZNAK PO ZNAKU i tylko wtedy, gdy dlugosc
   * sie zgadza — inaczej indeksy w tekscie przestaja pasowac do indeksow glifow i
   * podswietlenie ladu je obok slowa. „ł" nie ma rozkladu NFD, wiec ma wlasny wpis. */
  const RECZNIE = { 'ł': 'l', 'Ł': 'l' }
  function znak(ch) {
    if (/\s/.test(ch)) return ' '
    const r = RECZNIE[ch]
    if (r) return r
    const d = ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    return d.length === ch.length ? d : ch
  }
  function norm(s) {
    let out = ''
    for (const ch of s) out += znak(ch)
    return out
  }

  /* ── zrodla: kazdy <text> to JEDNA linia tekstu ──────────────────────────── */
  let zrodla = null
  function zbierz() {
    if (zrodla) return zrodla
    zrodla = []
    for (const el of document.querySelectorAll('#pan svg text')) {
      const tresc = el.textContent || ''
      if (!tresc.trim()) continue
      zrodla.push({ el, norm: norm(tresc), gora: 0, lewo: 0 })
    }
    // kolejnosc czytania (z gory na dol, potem od lewej). Mierzymy raz i wszystkie
    // naraz, wiec biezacy pan/zoom nie ma znaczenia — dotyka wszystkich tak samo.
    for (const z of zrodla) {
      const r = z.el.getBoundingClientRect()
      z.gora = Math.round(r.top); z.lewo = Math.round(r.left)
    }
    zrodla.sort((a, b) => (a.gora - b.gora) || (a.lewo - b.lewo))
    return zrodla
  }

  /* ── stan ────────────────────────────────────────────────────────────────── */
  let trafienia = []
  let aktywne = -1

  function czysc() {
    for (const t of trafienia) if (t.rect && t.rect.parentNode) t.rect.parentNode.removeChild(t.rect)
    trafienia = []; aktywne = -1
  }

  // Prostokat podswietlenia wstawiamy DO TEJ SAMEJ grupy co tekst i PRZED nim:
  // grupa ma juz transform elementu, wiec prostokat sam jezdzi z pan/zoomem, a wstawiony
  // przed tekstem laduje pod literami, nie na nich.
  function podswietl(el, od, do_) {
    let b = null
    try {
      const a = el.getExtentOfChar(od)
      const z = el.getExtentOfChar(Math.max(od, do_ - 1))
      const x1 = Math.min(a.x, z.x), x2 = Math.max(a.x + a.width, z.x + z.width)
      const y1 = Math.min(a.y, z.y), y2 = Math.max(a.y + a.height, z.y + z.height)
      if (x2 > x1 && y2 > y1) b = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
    } catch { b = null }   // getExtentOfChar potrafi rzucic — wtedy podswietlamy cala linie
    if (!b) { const g = el.getBBox(); b = { x: g.x, y: g.y, w: g.width, h: g.height } }
    const r = document.createElementNS(NS, 'rect')
    r.setAttribute('x', b.x - 1); r.setAttribute('y', b.y - 1)
    r.setAttribute('width', b.w + 2); r.setAttribute('height', b.h + 2)
    r.setAttribute('rx', 2); r.setAttribute('class', 'trafienie')
    el.parentNode.insertBefore(r, el)
    return r
  }

  function maluj() {
    for (let i = 0; i < trafienia.length; i++) {
      trafienia[i].rect.setAttribute('class', i === aktywne ? 'trafienie aktywne' : 'trafienie')
    }
    licznik.textContent = trafienia.length ? (aktywne + 1) + ' / ' + trafienia.length : '0 / 0'
    licznik.className = trafienia.length ? '' : 'brak'
  }

  function szukaj(fraza) {
    czysc()
    const q = norm(String(fraza || '')).trim()
    if (!q) { maluj(); zapiszLink(''); return }
    for (const z of zbierz()) {
      let i = 0
      while ((i = z.norm.indexOf(q, i)) !== -1) {
        trafienia.push({ el: z.el, od: i, do: i + q.length, rect: null })
        i += q.length
      }
    }
    for (const t of trafienia) t.rect = podswietl(t.el, t.od, t.do)
    if (trafienia.length) idz(0); else maluj()
    zapiszLink(fraza)
  }

  // Ile pikselow na ekranie ma miec trafienie, zeby dalo sie je przeczytac.
  const CEL_PX = 22

  // Skok do trafienia: najpierw zoom, POTEM pomiar i korekta przesuniecia — w tej
  // kolejnosci, bo zoom zmienia polozenie prostokata na ekranie.
  //
  // ⚠️ Zoom liczymy Z WYSOKOSCI TRAFIENIA, nie ze sztywnej liczby. Sztywne „ustaw 180%"
  // dziala tylko dla malego rysunku: plotno jest wpasowane w okno (width/height 100% +
  // viewBox), wiec przy rysunku szerokim na 8000 jednostek 180% to wciaz literki po 3 px
  // — trafienie bylo idealnie na srodku ekranu i zupelnie nieczytelne.
  function idz(i) {
    if (!trafienia.length) return
    aktywne = (i + trafienia.length) % trafienia.length
    maluj()
    const rect = trafienia[aktywne].rect
    const r0 = rect.getBoundingClientRect()
    if (r0.height > 0 && r0.height < CEL_PX) {
      V.k = Math.min(8, V.k * (CEL_PX / r0.height))   // sufit taki sam jak przy zoomie kolkiem
      V.apply()
    }
    const s = V.stage.getBoundingClientRect()
    const r = rect.getBoundingClientRect()
    V.tx += (s.left + s.width / 2) - (r.left + r.width / 2)
    V.ty += (s.top + s.height / 2) - (r.top + r.height / 2)
    V.apply()
  }

  // Fraza w adresie, zeby dalo sie podac komus link prosto do miejsca w rysunku
  // (tak wchodzi wynik z search.mjs i z galerii). replaceState, zeby nie zasmiecac historii.
  function zapiszLink(fraza) {
    if (!history.replaceState) return
    const h = fraza ? '#q=' + encodeURIComponent(fraza) : ''
    if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h)
  }

  /* ── obsluga ─────────────────────────────────────────────────────────────── */
  let czekacz = null
  pole.addEventListener('input', () => {
    clearTimeout(czekacz)
    czekacz = setTimeout(() => szukaj(pole.value), 120)
  })
  pole.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(czekacz)
      if (!trafienia.length) szukaj(pole.value); else idz(aktywne + (e.shiftKey ? -1 : 1)) }
    if (e.key === 'Escape') { pole.value = ''; szukaj(''); pole.blur() }
  })
  const dalej = document.getElementById('qx'), wstecz = document.getElementById('qp')
  if (dalej) dalej.onclick = () => idz(aktywne + 1)
  if (wstecz) wstecz.onclick = () => idz(aktywne - 1)

  // Ctrl+F przejmujemy na wlasne pole — przegladarkowe „znajdz" na tej stronie nie
  // potrafi doscrollowac do trafienia (kadrem steruje transform, nie scroll).
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault(); pole.focus(); pole.select()
    }
    if (e.key === 'Escape' && document.activeElement !== pole && trafienia.length) {
      pole.value = ''; szukaj('')
    }
  })

  // wejscie z linku: index.html#q=fraza
  const h = decodeURIComponent((location.hash || '').replace(/^#q=/, ''))
  if (h && location.hash.indexOf('#q=') === 0) {
    pole.value = h
    // fonty musza byc gotowe, inaczej getExtentOfChar mierzy zastepczy krój
    const start = () => szukaj(h)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start()
  }
})()

</script>
